name: Bug report
description: Report a reproducible problem in the engine, TUI, audit, or packaging.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove sensitive network data, credentials, and private rule content before posting.
  - type: input
    id: version
    attributes:
      label: Suricata Policy Engine version
      placeholder: 2.0.0b4
    validations:
      required: true
  - type: input
    id: suricata
    attributes:
      label: Suricata version
      placeholder: 8.0.x
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation method, and relevant paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or decision trace
      description: Do not include secrets, internal IPs if sensitive, or proprietary rules unless you intend to publish them.
