[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suricata-policy-engine"
version = "2.0.0rc2"
description = "Context-aware Policy-as-Code tuning, explainability, telemetry and safe activation for Suricata rulesets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Suricata Policy Engine contributors" }]
keywords = ["suricata", "ids", "ips", "soc", "detection-engineering", "rules", "policy-as-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
suricata-policy-engine = "tui:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "generate_suricata_policy",
  "policy_insights",
  "profiles",
  "rule_explorer",
  "run_history",
  "runtime_paths",
  "tui",
  "tune_rules",
  "telemetry",
]
packages = ["suricata_policy_engine_data"]
include-package-data = true

[tool.setuptools.package-data]
suricata_policy_engine_data = ["*.yaml", "*.json"]

