# ============================================================
# Alert Tuning / Threshold & Suppress Policy
# ============================================================
# This section controls alert volume without removing the underlying detection rule.
# The generator builds threshold.config entries for enabled rules in the categories below.
# If a rule already contains threshold/detection_filter logic, the generator does not override it.
# Suppression is added only when an administrator explicitly defines a SID/IP entry under suppressions.

alert_tuning:
  enabled: true

  profiles:
    ET_SCAN:
      type: limit
      track: by_src
      count: 5
      seconds: 60

    ET_DOS:
      type: limit
      track: by_src
      count: 5
      seconds: 60

    ET_CINS:
      type: limit
      track: by_src
      count: 1
      seconds: 300

    ET_DNS:
      type: limit
      track: by_src
      count: 5
      seconds: 300

    ET_DROP:
      type: limit
      track: by_src
      count: 1
      seconds: 300

    ET_SMTP:
      type: limit
      track: by_src
      count: 5
      seconds: 300

    ET_INFO:
      type: limit
      track: by_src
      count: 3
      seconds: 300

    ET_TFTP:
      type: limit
      track: by_src
      count: 3
      seconds: 300

    ET_POLICY:
      type: limit
      track: by_src
      count: 3
      seconds: 300

    GPL_MISC:
      type: limit
      track: by_src
      count: 5
      seconds: 300

    ET_HUNTING:
      type: limit
      track: by_src
      count: 5
      seconds: 300

    ET_USER_AGENTS:
      type: limit
      track: by_src
      count: 3
      seconds: 600

    ET_ADWARE_PUP:
      type: limit
      track: by_src
      count: 3
      seconds: 600

    SURICATA:
      type: limit
      track: by_rule
      count: 10
      seconds: 60

  # Example format:
  # suppressions:
  #   - sid: 1234567
  #     track: by_src
  #     ip: 10.10.10.5
  suppressions: []

  # Optional per-SID threshold overrides take precedence over category profiles.
  # Keep these explicit and reviewed; telemetry recommendations never populate them automatically.
  # Example:
  # sid_overrides:
  #   2010935:
  #     type: limit
  #     track: by_src
  #     count: 2
  #     seconds: 300
  sid_overrides: {}


# ============================================================
# EVE Telemetry (Recommendation-Only)
# ============================================================
# Pass one or more --eve /path/to/eve.json files to the CLI. The analyzer summarizes
# observed alert volume and points out SIDs worth reviewing. It never disables, suppresses,
# or threshold-tunes a rule automatically because alert volume alone is not evidence of a false positive.

telemetry:
  enabled: true
  mode: recommendation_only

  recommendations:
    # A SID becomes a review candidate when either volume or rate crosses these values.
    min_alerts: 100
    noisy_rate_per_hour: 20
    top_n: 25

    # Used only to describe whether a noisy SID is concentrated around a few sources.
    concentrated_max_unique_sources: 3


# ============================================================
# Validation
# ============================================================
# These validation checks are enforced by tune_rules.py before an accepted ruleset is released.

validation:

  # The final ruleset must pass a syntax/configuration test using the real Suricata configuration.
  require_suricata_test: true

  # Duplicate SIDs are always rejected by the parser and are not configurable.

  # Flowbit dependencies must be validated before deployment.
  check_flowbit_dependencies: true

  # Xbit dependencies must also be validated by the dedicated validator.
  check_xbit_dependencies: true

  # If final-enabled rules use JA3/JA3S, reject configurations that explicitly disable JA3.
  # An unset value is valid because Suricata can enable JA3 on demand for loaded JA3 rules.
  require_ja3_fingerprinting: true

  # Optional strict mode: require an explicit `ja3-fingerprints: yes` in suricata.yaml.
  # Leave this false for normal Suricata semantics.
  require_explicit_ja3_fingerprinting: false

  # Generate a New/Updated/Removed SID diff between the previous and new releases.
  generate_diff_report: true
