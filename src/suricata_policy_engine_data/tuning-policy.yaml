      review_threshold: 50
    utt:
      enabled: false
      aliases:
      - UTT
      metadata:
        affected_product:
        - UTT
      msg_regex:
      - ^utt(?:\b|[-\s_/])
      match_threshold: 80
      review_threshold: 50
    progress_whatsup_gold:
      enabled: false
      aliases:
      - Progress WhatsUp Gold
      - WhatsUp Gold
      metadata:
        affected_product:
        - Progress_WhatsUp_Gold
      msg_regex:
      - ^(?:progress\s+)?whatsup\s+gold(?:\b|[-\s_/])
      match_threshold: 80
      review_threshold: 50

  # These remain simple on/off asset switches because the entire category maps to the technology.
  # Database products are kept separate from web-app assets. ET_SQL remains
  # PRESERVE_FEED in all shipped profiles. These switches take effect only if
  # an operator explicitly changes ET_SQL to ASSET_BASED.
  database_products:

    mssql:
      enabled: false
      aliases: [MSSQL, Microsoft SQL Server, SQL Server]
      metadata:
        affected_product: [MSSQL, Microsoft_SQL_Server, Microsoft SQL Server]
      msg_regex: ['^(?:mssql|microsoft\s+sql\s+server|sql\s+server)(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    mysql:
      enabled: false
      aliases: [MySQL]
      metadata:
        affected_product: [MySQL]
      msg_regex: ['^mysql(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    mariadb:
      enabled: false
      aliases: [MariaDB]
      metadata:
        affected_product: [MariaDB]
      msg_regex: ['^mariadb(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    postgresql:
      enabled: false
      aliases: [PostgreSQL, Postgres]
      metadata:
        affected_product: [PostgreSQL, Postgres]
      msg_regex: ['^(?:postgresql|postgres)(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    oracle_database:
      enabled: false
      aliases: [Oracle Database, Oracle DB, Oracle]
      metadata:
        affected_product: [Oracle_Database, Oracle Database]
      msg_regex: ['^oracle(?:\s+(?:database|db))?(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    sap_maxdb:
      enabled: false
      aliases: [SAP MaxDB, MaxDB]
      metadata:
        affected_product: [SAP_MaxDB, MaxDB]
      msg_regex: ['^(?:sap\s+)?maxdb(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50


  # Product values discovered from the operator's current ruleset can be enabled
  # here by the TUI.  They are exact affected_product metadata fallbacks used only
  # when no curated asset matcher already identifies the rule.
  feed_products: {}

  scada:
    enabled: false

  activex:
    enabled: false

  voip:
    enabled: false


# ============================================================
# Organization Policy
# ============================================================
# This section records organization-level security policy.
# Important: prohibited=true means use of that service is forbidden by policy; therefore
# detection_enabled=true should be used when Suricata must alert on any observed use.

organization_policy:

  # TOR is prohibited in the organization, so TOR detection is enabled.
  tor:
    prohibited: true
    detection_enabled: true

  # No final organization-policy decision has been recorded for these services yet.
  file_sharing:
    prohibited: null
    detection_enabled: false

  p2p:
    prohibited: null
    detection_enabled: false

  chat:
    prohibited: null
    detection_enabled: false

  dynamic_dns:
    prohibited: null
    detection_enabled: false

  # Optional policy categories discovered in the source ruleset. They remain disabled
  # until the organization explicitly wants visibility for them.
  games:
    prohibited: null
    detection_enabled: false

  inappropriate_content:
    prohibited: null
    detection_enabled: false

  # Additional ET POLICY semantic families.  These controls do NOT apply to
  # every ET POLICY rule; only the reviewed selectors under
  # organization_policy_selectors are affected.  Security-oriented ET POLICY
  # signatures that do not match a selector keep their feed state.
  anonymizers:
    prohibited: true
    detection_enabled: true

  cloud_storage:
    prohibited: null
    detection_enabled: false

  cleartext_credentials:
    prohibited: true
    detection_enabled: true

  outbound_database:
    prohibited: null
    detection_enabled: false

  # All remote-access applications are prohibited by organization policy.
  # default_policy=prohibited means future or previously unknown remote-access applications
  # should also be treated as prohibited unless explicitly allowed.
  remote_access:
    default_policy: prohibited
    detection_enabled: true

    applications:
      anydesk: prohibited
      teamviewer: prohibited
      screenconnect: prohibited
      connectwise: prohibited
      zoho_assist: prohibited
      syncromsp: prohibited
      centrastage: prohibited
      comodo_itarian: prohibited
      teramind: prohibited
      kaseya_pulseway: prohibited
      simplehelp: prohibited
      netsupport: prohibited
      netop: prohibited
      dameware: prohibited
      getscreen: prohibited
      microsoft_rdp: prohibited
      remote_utilities: prohibited



# ============================================================
# Organization Policy Semantic Selectors
# ============================================================
# ET POLICY is intentionally not treated as one giant usage-policy switch.
# These conservative selectors map only reviewed message families to organization
# decisions.  If no selector matches, the rule keeps its upstream feed state.

organization_policy_selectors:
  - name: Anonymizers / privacy networks
    organization_key: anonymizers
    msg_regex:
      - '(?i)\b(?:TOR|I2P|Invisible Internet Project|\.onion|onion proxy)\b'

  - name: Cloud storage / file sharing services
    organization_key: cloud_storage
    msg_regex:
      - '(?i)\b(?:Dropbox|Google Drive|OneDrive|Box\.com|WeTransfer|MEGA|File Shared via Zoom)\b'

  - name: Cleartext credentials
    organization_key: cleartext_credentials
    msg_regex:
      - '(?i)\b(?:clear[- ]?text|plaintext)\b.*\b(?:pass(?:word)?|credential|login)\b'
      - '(?i)\bHTTP POST contains pass= in cleartext\b'

  - name: Unexpected outbound database access
    organization_key: outbound_database
    msg_regex:
      - '(?i)\bOutbound (?:MSSQL|MySQL|PostgreSQL|Postgres|Oracle|MongoDB|Redis)\b'



# ============================================================
# Rule-Level Overrides
# ============================================================
# The primary mechanism here is SEMANTIC selection, not SID pinning.
# tracked_keep_sids are guardrails for known high-value signatures. The tuner audits
# their revision, message, category, and detection-logic fingerprint on every update.
# If a tracked SID disappears, semantic selectors can still pick up a replacement rule.
# Feed-disabled tracked SIDs are NOT force-enabled unless explicitly listed under force_enable_sids.

rule_overrides:

  ET_INFO:
    default_action: disable

    semantic_keep:
      - name: Remote administration tools prohibited by policy
        msg_regex:
          - '^ET INFO (?:Dameware|TeamViewer|RemoteControlX|PTsecurity Remote Desktop AeroAdmin|Remote Desktop AeroAdmin)'

      - name: Lateral movement and remote execution
        msg_regex:
          - '^ET INFO .*?(?:Lateral Movement|Powershell .* Over SMB|RunDll Request Over SMB|WMIC WMI Request Over SMB|Command Shell Activity .* SMB|Nslookup Command in SMB Traffic|Ipconfig Command in SMB Traffic|Remote AT Scheduled Job|PsExec service created|Possible winexe over SMB|WinRM wsman Access)'

      - name: High-value execution or payload indicators
        msg_regex:
          - '^ET INFO (?:Embedded Executable File in PDF|Possible IPMI 2\.0 RAKP Remote SHA1 Password Hash Retrieval|Possible NOP Sled Observed|Killbot JS Configuration - Possible Phishing|F5 BIG-IP - Command Execution|Observed (?:dir|ipconfig|netstat|tasklist|powershell) Command via Inbound ICMP)'

    # Known high-value signatures are tracked for feed drift, but semantic rules above
    # are what make this policy resilient when a vendor replaces a SID.
    tracked_keep_sids:
      - 2001294
      - 2009475
      - 2010781
      - 2010782
      - 2011865
      - 2017120
      - 2025009
      - 2025709
      - 2025710
      - 2025711
