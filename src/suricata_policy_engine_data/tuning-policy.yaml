      - 2025719
      - 2025720
      - 2025721
      - 2025722
      - 2025723
      - 2025724
      - 2025725
      - 2025726
      - 2026849
      - 2026879
      - 2027169
      - 2027170
      - 2027171
      - 2027172
      - 2027173
      - 2027174
      - 2027175
      - 2027177
      - 2027178
      - 2027179
      - 2027180
      - 2027181
      - 2027182
      - 2027183
      - 2027184
      - 2027185
      - 2027186
      - 2027202
      - 2027267
      - 2030524
      - 2030525
      - 2032468
      - 2035467
      - 2049259
      - 2062639
      - 2062640
      - 2062641
      - 2062642
      - 2062643

    force_enable_sids: []

    tracked_sid_policy:
      on_change: keep_if_feed_enabled_and_warn
      on_missing: semantic_fallback_and_warn
      baseline_file: tracked-rules-baseline.json

  ET_TFTP:
    default_action: disable

    semantic_keep:
      - name: Cisco configuration transfer exposure
        msg_regex:
          - '^ET TFTP Outbound TFTP Data Transfer .*Cisco (?:config|Config)'

    tracked_keep_sids:
      - 2015857
      - 2024481

    force_enable_sids: []

    tracked_sid_policy:
      on_change: keep_if_feed_enabled_and_warn
      on_missing: semantic_fallback_and_warn
      baseline_file: tracked-rules-baseline.json


