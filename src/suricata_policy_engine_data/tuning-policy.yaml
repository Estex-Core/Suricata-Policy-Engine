# ============================================================
# Suricata Policy Engine - Tuning Policy
# ============================================================
# This file is the source of truth for rule-tuning decisions.
# The rule feed may change on every update, while the tuning logic remains stable.
# Suricata does not consume this file directly; the generator uses it to build
# enable.conf / disable.conf / threshold.config.

version: 3

name: suricata-policy-engine-policy

description: >
  Context-aware Suricata tuning policy. Asset decisions use metadata-first matching with
  explicit aliases/regex fallback. Semantic selectors are preferred over fixed SID lists,
  while tracked SIDs act as audited guardrails across rule-feed updates.


# ============================================================
# Global Defaults
# ============================================================
# Global settings applied across the entire policy.
# preserve_dependencies means that if an enabled rule depends on a specific flowbit/xbit,
# the setter rule must not be removed merely because it belongs to a disabled category.

defaults:
  preserve_dependencies: true

  # A dependency is restored only when a final enabled rule actually requires it.
  # This step runs after category, asset, and organization-policy decisions are finalized,
  # so orphan setters or setters used only by disabled rules are not restored unnecessarily.
  dependency_restore:
    enabled: true
    only_if_required_by_enabled_rule: true
    run_after_final_policy_resolution: true

  # Dependency types that must be evaluated during tuning.
  dependency_types:
    - flowbits
    - xbits

  # Do not automatically remove a category that appears for the first time in a new feed.
  # This conservative behavior prevents accidental removal of newly introduced rules.
  disable_unknown_categories: false


# ============================================================
# Category Policy
# ============================================================
# Policy modes:
#   preserve_feed -> Preserve each rule state exactly as published by the feed.
#   disable       -> Disable the category by policy.
#   asset_based   -> Enable rules only when the related asset/technology exists.
#   conditional   -> Resolve the category using context, organization policy, or selective logic.

categories:

  # -------------------- Core Threat Detection --------------------
  # Direct malware, exploit, phishing, and post-exploitation detections.
  # These are core detections; no category-wide removal is applied here.

  ET_MALWARE:
    mode: preserve_feed

  ET_EXPLOIT:
    mode: preserve_feed

  ET_EXPLOIT_KIT:
    mode: preserve_feed

  ET_PHISHING:
    mode: preserve_feed

  ET_ATTACK_RESPONSE:
    mode: preserve_feed

  ET_SHELLCODE:
    mode: preserve_feed

  ET_CNC:
    mode: preserve_feed

  ET_COINMINER:
    mode: preserve_feed

  ET_WORM:
    mode: preserve_feed

  ET_CURRENT_EVENTS:
    mode: preserve_feed

  ET_COMPROMISED:
    mode: preserve_feed

  # Malware detections for Android/iOS and other mobile operating systems; high-value security signal.
  ET_MOBILE_MALWARE:
    mode: preserve_feed

  # Covers web-client/browser attacks, exploits, and other client-side techniques.
  # Client systems are a common initial-access path, so feed-enabled rules are preserved.
  ET_WEB_CLIENT:
    mode: preserve_feed


  # -------------------- Additional High-Value Protocol Categories --------------------
  # These categories were found during the final audit of the real ruleset. Their rule counts are small,
  # and current rules mainly cover exploits, lateral movement, credential abuse, or malicious protocol activity.

  ET_FTP:
    mode: preserve_feed

  ET_NETBIOS:
    mode: preserve_feed

  ET_RPC:
    mode: preserve_feed

  ET_SNMP:
    mode: preserve_feed

  ET_SQL:
    mode: preserve_feed

  ET_TELNET:
    mode: preserve_feed

  # High-confidence Cobalt Strike C2 infrastructure feed from Threatview.io.
  ET_Threatview.io:
    mode: preserve_feed

  # GPL rules that exist only under the legacy/community prefix but still represent
  # direct protocol exploit signatures.
  GPL_IMAP:
    mode: preserve_feed

  GPL_POP3:
    mode: preserve_feed


  # -------------------- Keep, but Alert-Tune --------------------
  # Detection value is high, but these categories may generate significant operational noise.
  # Feed-enabled rules are preserved while threshold/suppress controls are applied to alerts.

  ET_SCAN:
    mode: preserve_feed
    alert_tuning: true

  ET_DOS:
    mode: preserve_feed
    alert_tuning: true

  # CINS is a reputation/threat-intelligence feed of known-bad IPs; a match alone does not prove compromise.
  # It is useful for SOC visibility but may generate high perimeter volume, so it stays enabled with alert tuning.
  ET_CINS:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true


  # -------------------- Asset-Based Categories --------------------
  # Enable these categories only when the related technology/service exists in the environment.

  ET_WEB_SPECIFIC_APPS:
    mode: asset_based

  ET_WEB_SERVER:
    mode: asset_based

  # SCADA is disabled by default and should be enabled only in ICS/OT environments.
  ET_SCADA:
    mode: asset_based
    default_enabled: false

  # ActiveX is primarily legacy technology; enable it only when it is actually in use.
  ET_ACTIVEX:
    mode: asset_based
    default_enabled: false


  # VOIP/SIP/H.323 rules are relevant only when voice infrastructure exists.
  # Keep them disabled until the asset inventory confirms such infrastructure.
  ET_VOIP:
    mode: asset_based
    default_enabled: false


  # -------------------- Conditional Categories --------------------
  # These categories are neither useless nor suitable for unconditional enablement.

  # Remote-access software may be legitimate or attacker-controlled; organization policy determines handling.
  ET_REMOTE_ACCESS:
    mode: conditional
    strategy: organization_policy

  # User-Agent detection is a supporting signal and does not prove compromise by itself.
  ET_USER_AGENTS:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # JA3/TLS fingerprints provide a behavioral TLS signal for the SOC.
  # It stays enabled by default, but a JA3 match alone is not proof of malware and should be correlated.
  ET_JA3:
    mode: conditional
    strategy: enabled_by_default
    default_enabled: true

  # PUP/Adware is not always equivalent to high-impact malware and should be handled according to SOC requirements.
  ET_ADWARE_PUP:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # Hunting rules are useful for behavioral analysis but may generate high alert volume.
  ET_HUNTING:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # ET INFO is disabled by default. Only the security allowlist below and required dependencies are restored.
  ET_INFO:
    mode: conditional
    strategy: default_disabled_with_allowlist
    default_enabled: false
    preserve_if_dependency: true

  # Dynamic DNS is not inherently malicious; enable detection only when required by organization policy.
  ET_DYN_DNS:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  # TOR is not inherently an attack; enable its detection when TOR usage is prohibited by policy.
  ET_TOR:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  # File-sharing detection is primarily policy/visibility-oriented rather than direct threat detection.
  ET_FILE_SHARING:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  # P2P is also primarily usage/policy detection.
  ET_P2P:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  # Chat detection is mainly useful for policy enforcement and visibility.
  ET_CHAT:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  # Covers services such as URL shorteners, Pastebin, and some file-sharing platforms frequently abused by threat actors.
  # Using these services is not inherently malicious, so they are disabled by default and enabled for specific hunting/use cases.
  ET_TA_ABUSED_SERVICES:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false


  # DNS contains a mix of C2, sinkhole, tunneling, and broader signals such as suspicious TLD activity.
  # It stays enabled by default, while noisy rules can be thresholded or suppressed.
  ET_DNS:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # ET DROP in this feed refers to the Spamhaus DROP reputation list, not the Suricata drop action.
  # It is useful for enrichment/reputation but may generate high alert volume at the perimeter.
  ET_DROP:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # In the current snapshot, SMTP mainly contains payload, hash-leak, and malicious-MIME detections,
  # but the category can also contain logging-oriented rules; it stays enabled with noise controls.
  ET_SMTP:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true

  # Generic TFTP rules are primarily policy/visibility oriented and are disabled by default;
  # only the Cisco configuration-transfer rules listed below are explicitly preserved at SID level.
  ET_TFTP:
    mode: conditional
    strategy: default_disabled_with_allowlist
    default_enabled: false

  # GPL MISC contains a mix of exploit/response detections and legacy protocol activity;
  # it stays enabled to avoid losing useful detections, while alert noise should be monitored.
  GPL_MISC:
    mode: conditional
    strategy: enabled_by_default_with_alert_tuning
    default_enabled: true
    alert_tuning: true


  # ET POLICY is a mixed bucket: some signatures are pure usage-policy signals,
  # while others carry meaningful security context.  Only explicitly reviewed
  # semantic families below are controlled by Organization Policy; unmatched
  # ET POLICY rules preserve their upstream feed state.
  ET_POLICY:
    mode: conditional
    strategy: organization_policy_selective


  # -------------------- Disable Categories --------------------
  # Rules with low direct NIDS/SOC security value or rules that are retired.

  ET_GAMES:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  ET_INAPPROPRIATE:
    mode: conditional
    strategy: disabled_by_default
    default_enabled: false

  ET_RETIRED:
    mode: disable


  # GPL ICMP in this snapshot contains only legacy PING/OS fingerprints and
  # provides little direct detection value for the SOC.
  GPL_ICMP:
    mode: disable


  # -------------------- Suricata Engine / Protocol Anomalies --------------------
  # These rules represent Suricata decoder/parser/stream anomalies.
  # Not every anomaly is a confirmed attack, but removing all of them would also be inappropriate.
  # Security-relevant anomalies are preserved while noisy visibility-only cases are filtered or tuned.

  SURICATA:
    mode: conditional
    strategy: message_filter
    alert_tuning: true
    message_filter:
      # TRAFFIC-ID signatures provide application visibility, not threat detection.
      disable_contains:
        - "TRAFFIC-ID:"


# ============================================================
# Asset Inventory
# ============================================================
# Asset-based categories are resolved from this inventory.
# For ET_WEB_SPECIFIC_APPS the matcher is intentionally conservative:
#   1) affected_product (or another configured metadata key)
#   2) anchored product aliases at the start of the category-specific message
#   3) explicit regular expressions
# Fuzzy substring matching is not used. Ambiguous matches are left disabled and reported.

assets:

  web_server:
    enabled: true

  web_specific_apps:

    nginx:
      enabled: true
      aliases:
        - Nginx
        - NGINX
        - nginx-ui
        - NGINX UI
      metadata:
        affected_product:
          - Nginx
          - NGINX
          - nginx-ui
          - NGINX_UI
      msg_regex:
        - '^nginx(?:\b|[-\s_/])'
        - '^nginx-ui(?:\b|[-\s_/])'
      match_threshold: 80
      review_threshold: 50

    wordpress:
      enabled: false
      aliases: [WordPress, Wordpress]
      metadata:
        affected_product: [WordPress, Wordpress]
      msg_regex: ['^wordpress(?:\b|[-\s_/])']
      match_threshold: 80
      review_threshold: 50

    jboss:
      enabled: false
      aliases: [JBoss, Red Hat JBoss]
      metadata:
        affected_product: [JBoss, Red_Hat_JBoss]
